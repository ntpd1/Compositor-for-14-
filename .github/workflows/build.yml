name: Build Compositor for macOS14/15
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release App
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Check Xcode version
        run: xcodebuild -version

      - name: Resolve Swift Package Dependencies
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor

      - name: Build Release (arm64, no codesign)
        run: >
          xcodebuild build
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -configuration Release
          -derivedDataPath DerivedData
          CODE_SIGN_IDENTITY=""
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO

      - name: Zip compiled App
        run: |
          APP_PATH="DerivedData/Build/Products/Release/Compositor.app"
          ls -la "$APP_PATH"
          xattr -cr "$APP_PATH"
          zip -r Compositor-arm64-macos14.zip "$APP_PATH"

      - name: Upload compiled app
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-arm64-build
          path: Compositor-arm64-macos14.zip
          retention-days: 14
