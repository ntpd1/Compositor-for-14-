name: Build Compositor for macOS14/15
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release App
    runs-on: macos-14
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Resolve Swift Package Dependencies
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor

      - name: Build Release (arm64, no codesign)
        run: >
          xcodebuild build
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -configuration Release
          CODE_SIGN_IDENTITY=""
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO

      - name: Prepare & Zip App
        run: |
          cd build/Release
          xattr -cr Compositor.app
          zip -r Compositor-arm64-macos14.zip Compositor.app

      - name: Upload compiled app
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-arm64-build
          path: build/Release/Compositor-arm64-macos14.zip
          retention-days: 14
