name: Build Compositor
on:
  workflow_dispatch: # 支持手动点击 Run workflow 触发

jobs:
  build:
    runs-on: macos-15        # 或 macos-latest / macos-16，自带更新的 Xcode
    steps:
      - uses: actions/checkout@v4   # 注意可顺便升到 v5 消除 Node 20 警告
      # 显式选择兼容新版工程格式的 Xcode
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'     # 或与写入格式77一致的版本
      - name: Build
        run: |
          xcodebuild -project Compositor.xcodeproj -scheme Compositor \
            -configuration Release CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Zip App
        run: |
          cd build/Release
          zip -r Compositor.zip Compositor.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-macos14-build
          path: build/Release/Compositor.zip
